; 复制到 ~/.config/remote-dispatch/config.ini（或用环境变量 RD_CONFIG 指到别处）。

[defaults]
; 这里的值对所有机器生效，单台机器的小节可以覆盖。
; workdir = ~/remote-dispatch        ; 远端存放仓库、worktree 和日志的目录
; sync = origin                      ; origin：经仓库的 origin 同步；direct：经 SSH 直接同步
; launcher = nohup                   ; nohup 或 tmux
; timeout = 3600                     ; 单个任务的时限（秒）
; 没有会话数上限：一台机器能接几个任务由下面四项负载指标决定，不达标就不派
; max_heavy = 1                      ; 同时运行的重命令数（rd-heavy / --heavy）
; max_load_per_core = 1.5            ; 1 分钟负载除以核数超过它就不派
; min_free_mem_pct = 10              ; 空闲内存百分比低于它就不派
; min_free_disk_gb = 10              ; 可用磁盘低于它就不派
; max_swap_used_gb = 15             ; 已用交换空间超过它就不派（GB），换页严重时任务会一起变慢
; platform = posix                  ; macos/linux/posix/windows；Windows 必须单独设置
; python = python                   ; Windows Python 可执行文件；POSIX 员工配置使用 python3
; max_cpu_pct = 85                   ; Windows CPU 采样上限，不能与 Unix load average 混用
; path = $HOME/.local/bin:$HOME/.kimi-code/bin:/opt/homebrew/bin:/usr/local/bin
; ssh_opts = -o BatchMode=yes -o ConnectTimeout=8

[monitor]
; 发起方统一巡检周期（秒），默认15分钟；RD_REPORT_INTERVAL_SECONDS优先。
report_interval_seconds = 900

[host:mini]
ssh = user@worker.example.invalid
; tags = docker,arm64                ; 配合 rd run --tag 筛选机器
; env_file = ~/.config/remote-dispatch/env   ; 远端文件，任务启动前加载
; codex_auth_file = ~/.codex/auth.json     ; 仅在管理员明确批准共用登录时指定；不自动使用
; enabled = false                    ; 暂时不参与自动选择

; RD_USER_ID 在员工派单端环境变量中设置，不放在共享机器默认配置里。
; Codex 个人配置包：RD_PROFILE_DIR 或 ~/.config/remote-dispatch/profiles/<ID>/。
; workdir 下自动分成 users/<ID>/{profiles,repos,wt,jobs}；locks 在机器级共用。

[host:windows-example]
enabled = false
ssh = worker@windows-host
platform = windows
python = C:/Python312/python.exe
workdir = C:/rd
sync = direct
; path = C:/Program Files/Git/cmd;C:/Python312;%APPDATA%/npm
; env_file = C:/worker-private/api-env.json
; codex_auth_file = C:/Users/worker/.codex/auth.json

; 小节名是 origin 地址里的仓库名。
[project:myrepo]
setup = npm ci
test = npm test
; setup_windows = npm ci            ; 不同命令时按 PowerShell 语法填写
; test_windows = npm test
; test_heavy = false
; origin_url = git@github.com:me/myrepo.git   ; 远端访问仓库的地址和本机不同时才写

; 覆盖或新增代理，见 references/agents.md。
; [agent:codex]
; start = codex exec -C "$RD_WT" -s workspace-write -c approval_policy=never --json {model_args} - < "$RD_PROMPT"
