<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>青椿版画社 · 编辑活动｜界面工作室示例</title>
    <link rel="stylesheet" href="studio.css" />
    <link rel="stylesheet" href="interaction.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <a class="skip" href="#main">跳到内容</a>
    <header class="mast">
      <a class="brand" href="index.html">青椿版画社 <span>／ 交互</span></a>
      <nav aria-label="主导航">
        <a href="index.html">组件</a><a href="workspace.html">工作区</a
        ><a href="interaction.html" aria-current="page">交互</a
        ><a href="effects.html">动效</a>
      </nav>
    </header>
    <main id="main">
      <div class="intro">
        <p class="page-kicker">十月工作坊</p>
        <h1>编辑活动页</h1>
      </div>
      <div class="interaction-grid">
        <section class="event-page" aria-labelledby="event-heading">
          <div class="event-art" aria-hidden="true"></div>
          <div class="event-body">
            <h2 id="event-heading" class="sr">活动页</h2>
            <div id="state-panel" aria-live="polite"></div>
            <div class="row event-actions">
              <button id="open-dialog">编辑活动</button>
              <details>
                <summary>更多</summary>
                <button id="reset" class="quiet">恢复初始内容</button>
              </details>
            </div>
          </div>
        </section>
        <aside class="console" aria-labelledby="console-title">
          <h2 id="console-title">演示控制</h2>
          <p>不是产品界面，只用来把页面切到各种状态。</p>
          <label
            >页面状态<select id="view-state">
              <option value="ready">就绪</option>
              <option value="loading">加载中</option>
              <option value="empty">空内容</option>
              <option value="error">加载失败</option>
              <option value="offline">离线</option>
              <option value="denied">无权限</option>
            </select></label
          >
          <label class="switch"
            ><input id="fail-save" type="checkbox" /> 下一次保存返回错误</label
          ><label class="switch"
            ><input id="slow-save" type="checkbox" /> 慢速网络（保存要 3 秒）</label
          >
          <p id="persist-status" role="status"></p>
        </aside>
      </div>
      <p id="page-status" class="seal-result" role="status"></p>
    </main>
    <dialog id="editor" aria-labelledby="dialog-title">
      <form id="edit-form" novalidate>
        <div class="row dialog-head">
          <h2 id="dialog-title">编辑活动</h2>
          <button
            type="button"
            id="close-dialog"
            class="quiet"
            aria-label="关闭编辑窗口"
          >
            关闭
          </button>
        </div>
        <label for="title">活动名称</label
        ><input
          id="title"
          name="title"
          required
          maxlength="60"
          autocomplete="off"
          aria-describedby="title-hint title-error"
        /><small id="title-hint">1–60 个字，会显示在活动页标题</small
        ><p id="title-error" class="field-error" hidden></p
        ><label for="email">报名联系邮箱</label
        ><input
          id="email"
          name="email"
          type="email"
          required
          autocomplete="email"
          aria-describedby="email-error"
        /><p id="email-error" class="field-error" hidden></p
        ><label for="description">介绍</label
        ><textarea
          id="description"
          name="description"
          rows="3"
          maxlength="200"
        ></textarea>
        <div class="row dialog-actions">
          <button id="save" type="submit">保存活动</button
          ><button id="cancel" type="button" class="quiet">取消</button>
        </div>
        <div class="save-slot">
          <p id="form-error" role="alert" class="error" hidden></p>
          <p id="save-status" role="status"></p>
        </div>
        <p id="draft-note" class="draft-note" hidden>
          这是上次没保存的修改。<button type="button" id="discard-draft" class="quiet">放弃这些修改</button>
        </p>
      </form>
    </dialog>
    <script src="interaction.js"></script>
  </body>
</html>
