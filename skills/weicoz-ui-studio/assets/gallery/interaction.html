<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>界面工作室 · 交互状态</title><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="interaction.css"><link rel="icon" href="data:,"></head><body><a class="skip" href="#main">跳到内容</a><header class="mast"><a class="brand" href="index.html">界面工作室 <span>／ 交互</span></a><nav aria-label="主导航"><a href="index.html">组件</a><a href="workspace.html">工作区</a><a href="interaction.html" aria-current="page">交互</a><a href="effects.html">动效</a></nav></header><main id="main"><div class="intro"><p class="eyebrow">每一种状态，都有下一步</p><h1>从等待，到确定。</h1><p>检查输入、保存、失败与恢复，让操作始终有去有回。</p></div><div class="interaction-grid"><section class="notice"><h2>阅读计划</h2><label>查看状态<select id="view-state"><option value="ready">就绪</option><option value="loading">加载中</option><option value="empty">空内容</option><option value="error">加载失败</option><option value="offline">离线</option><option value="denied">无权限</option></select></label><div id="state-panel" aria-live="polite"></div><button id="open-dialog">编辑计划</button><details><summary>更多选项</summary><button id="reset" class="quiet">恢复初始计划</button></details></section><section class="notice"><h2>本地保存规则</h2><label><input id="fail-save" type="checkbox"> 本次保存返回错误</label><p>用于检查失败后输入保留和重试路径。</p><p id="persist-status" role="status"></p></section></div><p id="page-status" role="status"></p></main>
<dialog id="editor" aria-labelledby="dialog-title"><form id="edit-form"><div class="row"><h2 id="dialog-title">编辑阅读计划</h2><button type="button" id="close-dialog" class="quiet" aria-label="关闭编辑窗口">关闭</button></div><p id="form-error" role="alert" class="error" hidden></p><label for="title">计划名称</label><input id="title" name="title" required maxlength="60" autocomplete="off" aria-describedby="title-hint"><small id="title-hint">1–60 个字符</small><label for="email">联系邮箱</label><input id="email" name="email" type="email" required autocomplete="email"><label for="description">介绍</label><textarea id="description" name="description" rows="3" maxlength="200"></textarea><div class="row"><button id="save" type="submit">保存计划</button><button id="cancel" type="button" class="quiet">取消</button></div><p id="save-status" role="status"></p></form></dialog><script src="interaction.js"></script></body></html>
